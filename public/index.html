<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d061f">
<title>College Event Portal</title>
<script src="/socket.io/socket.io.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
:root {
  --bg: #0b1428;
  --panel: #111e38;
  --card: #f8f3e8;
  --gold: #d4a73d;
  --muted: #8fa0bf;
  --line: #2b3955;
  --danger: #ef4444;
  --success: #16a34a;
  --nav-height: 64px;
}
*, *::before, *::after {
  box-sizing: border-box;
}
html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
  background: radial-gradient(circle at 20% 20%, #0d061f 0%, #05010e 50%, #020005 100%);
  color: #e2e8f0;
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

/* Navigation */
nav {
  position: sticky;
  top: 0;
  z-index: 100;
  padding: 10px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  background: rgba(13,6,31,0.9);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  min-height: var(--nav-height);
  padding-top: max(10px, env(safe-area-inset-top));
}
.nav-brand {
  display: flex;
  align-items: center;
}
.logo {
  font-size: clamp(19px, 3.5vw, 23px);
  font-weight: 800;
  cursor: pointer;
  color: #d4a73d;
  white-space: nowrap;
  transition: all 0.3s ease;
  text-shadow: 0 0 15px rgba(217,40,255,0.5);
  user-select: none;
}
.logo:hover {
  color: #ff00ff;
  text-shadow: 0 0 25px rgba(255,0,255,0.8);
}
.nav-links {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.nav-toggle {
  display: none;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.18);
  color: #e2e8f0;
  font-size: 22px;
  line-height: 1;
  width: 44px;
  height: 44px;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s ease;
  align-items: center;
  justify-content: center;
  padding: 0;
  touch-action: manipulation;
}
.nav-toggle:hover, .nav-toggle:focus-visible {
  background: rgba(255,255,255,0.16);
  border-color: rgba(0,240,255,0.4);
}
.user-chip {
  font-weight: 700;
  font-size: 13px;
  padding: 6px 12px;
  background: rgba(212,167,61,0.15);
  border: 1px solid rgba(212,167,61,0.3);
  border-radius: 20px;
  color: #d4a73d;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

/* Mobile Nav Drawer (< 768px) */
@media (max-width: 768px) {
  nav {
    padding-left: 14px;
    padding-right: 14px;
  }
  .nav-toggle {
    display: inline-flex;
  }
  .nav-links {
    position: fixed;
    top: var(--nav-height);
    left: 0;
    right: 0;
    background: rgba(11, 5, 26, 0.98);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 20px 45px rgba(0, 0, 0, 0.7);
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
    padding: 16px 18px 24px;
    max-height: calc(100vh - var(--nav-height));
    overflow-y: auto;
    transform: translateY(-115%);
    opacity: 0;
    pointer-events: none;
    transition: transform 0.26s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.22s ease;
    z-index: 99;
  }
  .nav-links.open {
    transform: translateY(0);
    opacity: 1;
    pointer-events: auto;
  }
  .nav-links button, .nav-links .btn {
    width: 100%;
    text-align: center;
    padding: 12px 16px;
    font-size: 15px;
  }
  .user-chip {
    justify-content: center;
    padding: 10px 14px;
    font-size: 14px;
    order: -1;
  }
}

/* Layout Container */
.container {
  width: 100%;
  max-width: 1200px;
  margin: auto;
  padding: 24px 18px;
  position: relative;
  z-index: 1;
}
@media (max-width: 600px) {
  .container {
    padding: 14px 12px;
  }
}

/* Cards */
.card {
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  color: #e2e8f0;
  padding: clamp(16px, 3.5vw, 24px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 14px;
  margin-bottom: 18px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.3);
  transition: all 0.3s ease;
  overflow-wrap: break-word;
  word-wrap: break-word;
}
.card:hover {
  border-color: rgba(0,240,255,0.4);
  box-shadow: 0 15px 40px rgba(138,43,226,0.25);
}
@media (hover: hover) {
  .card:hover {
    transform: translateY(-3px);
  }
}

/* Grids */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
  gap: 14px;
}
.events {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr));
  gap: 18px;
}
@media (max-width: 480px) {
  .events {
    grid-template-columns: 1fr;
    gap: 14px;
  }
}
.event {
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  color: #e2e8f0;
  padding: clamp(16px, 3vw, 20px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow: 0 5px 18px rgba(0,0,0,0.2);
  transition: all 0.3s ease;
}
.event h2 {
  font-size: clamp(18px, 3.5vw, 22px);
  margin: 10px 0 8px;
  line-height: 1.3;
}
@media (hover: hover) {
  .event:hover {
    transform: translateY(-5px);
    border-color: rgba(0,240,255,0.5);
    box-shadow: 0 20px 45px rgba(138,43,226,0.3);
  }
}

/* Inputs & Form Controls */
input, select, textarea {
  width: 100%;
  padding: 12px 14px;
  margin: 6px 0 14px;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 8px;
  font-size: 16px; /* Prevents auto-zoom on iOS */
  background: rgba(255,255,255,0.08);
  color: #e2e8f0;
  transition: all 0.2s ease;
  font-family: inherit;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  background: rgba(255,255,255,0.12);
  border-color: rgba(0,240,255,0.5);
  box-shadow: 0 0 12px rgba(0,240,255,0.3);
}
input::placeholder, select::placeholder, textarea::placeholder {
  color: rgba(226,232,240,0.5);
}

/* Buttons */
button, .btn {
  min-height: 42px;
  padding: 10px 16px;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
  background: linear-gradient(135deg,#7928ca 0%,#4338ca 100%);
  color: #ffffff;
  font-weight: 700;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  transition: all 0.2s ease, box-shadow 0.3s ease;
  white-space: nowrap;
  user-select: none;
  touch-action: manipulation;
}
button:hover, .btn:hover {
  box-shadow: 0 0 18px rgba(121,40,202,0.6);
  filter: brightness(1.1);
}
@media (hover: hover) {
  button:hover, .btn:hover {
    transform: translateY(-2px);
  }
}
button:active, .btn:active {
  transform: scale(0.98);
}
button:disabled {
  opacity: .5;
  cursor: not-allowed;
  transform: none;
  filter: none;
  box-shadow: none;
}
.btn-secondary {
  background: rgba(57,69,98,0.7);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.15);
  backdrop-filter: blur(10px);
}
.btn-secondary:hover {
  background: rgba(57,69,98,0.9);
  border-color: rgba(0,240,255,0.3);
}
.btn-danger {
  background: linear-gradient(135deg,#ef4444 0%,#dc2626 100%);
  color: #fff;
}
.btn-danger:hover {
  box-shadow: 0 0 15px rgba(239,68,68,0.5);
}
.btn-success {
  background: linear-gradient(135deg,#16a34a 0%,#15803d 100%);
  color: #fff;
}
.btn-success:hover {
  box-shadow: 0 0 15px rgba(22,163,74,0.5);
}

/* Actions Group */
.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}
.actions button, .actions .btn {
  flex: 1 1 auto;
  min-width: 100px;
  text-align: center;
}
@media (max-width: 480px) {
  .actions {
    gap: 10px;
  }
  .actions button, .actions .btn {
    width: 100%;
    flex: 1 1 100%;
  }
}

/* Header Flex Row */
.header-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 14px;
}
.header-actions h1, .header-actions h2 {
  margin: 0;
}
@media (max-width: 600px) {
  .header-actions {
    flex-direction: column;
    align-items: stretch;
  }
  .header-actions button, .header-actions .btn {
    width: 100%;
  }
}

.badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 20px;
  background: linear-gradient(135deg,#d4a73d 0%,#b8860b 100%);
  color: #0d061f;
  font-size: 12px;
  font-weight: 800;
  box-shadow: 0 4px 12px rgba(212,167,61,0.3);
}
.error { color: #ff6b9d; font-weight: 700; word-break: break-word; }
.success { color: #4ade80; font-weight: 700; }
.muted { color: #94a3b8; }
.small { font-size: 13px; line-height: 1.4; }

/* Hero Banner */
.hero {
  background: linear-gradient(135deg,rgba(22,40,73,0.8),rgba(14,25,48,0.8));
  border: 1px solid rgba(255,255,255,0.1);
  color: #e2e8f0;
  padding: clamp(20px, 4vw, 40px);
  border-radius: 16px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  margin-bottom: 26px;
  text-shadow: 0 2px 10px rgba(0,0,0,0.5);
}
.hero h1 {
  margin-top: 0;
  margin-bottom: 10px;
  font-size: clamp(24px, 4.5vw, 34px);
  color: #00f0ff;
  text-shadow: 0 0 20px rgba(0,240,255,0.5);
  line-height: 1.25;
}
.hero p {
  margin-top: 0;
  margin-bottom: 16px;
  font-size: clamp(14px, 2.5vw, 16px);
  line-height: 1.5;
  color: #cbd5e1;
}

/* Stats */
.stat {
  padding: clamp(12px, 2.5vw, 18px);
  border-radius: 12px;
  background: rgba(24,38,64,0.6);
  color: #e2e8f0;
  border: 1px solid rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
  transition: all 0.3s ease;
}
.stat:hover {
  border-color: rgba(0,240,255,0.3);
  transform: translateY(-2px);
}
.stat strong {
  display: block;
  font-size: clamp(22px, 4vw, 30px);
  color: #d4a73d;
  text-shadow: 0 0 10px rgba(212,167,61,0.5);
  margin-top: 4px;
}

/* Tables */
.table-wrap {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.1);
  margin: 14px 0;
}
.table {
  width: 100%;
  min-width: 580px;
  border-collapse: collapse;
  color: #e2e8f0;
  background: rgba(255,255,255,0.02);
}
.table th, .table td {
  padding: 12px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  text-align: left;
  vertical-align: middle;
  font-size: 14px;
}
.table th {
  background: rgba(212,167,61,0.15);
  font-weight: 700;
  color: #d4a73d;
  white-space: nowrap;
}
.table td select {
  margin: 0;
  padding: 6px 10px;
  font-size: 13px;
  min-width: 100px;
}

/* Tickets & QR */
.ticket-card {
  background: #ffffff;
  border: 1px solid #e2e8f0;
  color: #1a1a2e;
  border-radius: 12px;
  padding: clamp(16px, 3.5vw, 24px);
  margin-top: 14px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.15);
}
.ticket-card h2 {
  color: #0f172a;
  margin-top: 0;
  font-size: clamp(18px, 4vw, 22px);
}
.ticket-card p {
  color: #334155;
  margin: 6px 0;
}
.qr {
  max-width: min(220px, 75vw);
  width: 100%;
  height: auto;
  display: block;
  margin: 15px auto;
  padding: 12px;
  background: white;
  border-radius: 10px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.15);
}
.checkin-code-box {
  text-align: center;
  padding: 10px;
  background: #f1f5f9;
  border-radius: 8px;
  margin: 12px 0;
  word-break: break-all;
}

/* Notifications */
.notif {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  padding: clamp(12px, 3vw, 16px);
  margin: 10px 0;
  backdrop-filter: blur(10px);
  transition: all 0.2s ease;
  overflow-wrap: break-word;
}
.notif:hover {
  background: rgba(255,255,255,0.12);
  border-color: rgba(0,240,255,0.3);
}
.notif.unread {
  border-left: 5px solid #d4a73d;
  box-shadow: 0 0 12px rgba(212,167,61,0.2);
}

/* Toast */
#toast-banner {
  position: fixed;
  top: 76px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 32px);
  max-width: 440px;
  background: linear-gradient(135deg,#16a34a 0%,#15803d 100%);
  color: #fff;
  padding: 14px 18px;
  border-radius: 10px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  display: none;
  z-index: 1000;
  font-weight: 600;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.2);
  text-align: center;
  animation: toastSlide 0.3s ease;
}
@keyframes toastSlide {
  from { opacity: 0; transform: translate(-50%, -10px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}

/* Scanner */
#reader {
  width: 100%;
  max-width: 440px;
  margin: 15px auto;
  border-radius: 12px;
  overflow: hidden;
  background: #000;
  border: 2px solid rgba(0,240,255,0.3);
  box-shadow: 0 0 20px rgba(0,240,255,0.2);
}
#reader video {
  width: 100% !important;
  height: auto !important;
  border-radius: 10px;
}
.scanner-input-row {
  display: flex;
  gap: 8px;
  max-width: 650px;
  margin: 14px auto 0;
  align-items: center;
  flex-wrap: wrap;
}
.scanner-input-row input {
  flex: 1 1 200px;
  margin: 0;
}
.scanner-input-row button {
  flex: 0 0 auto;
  min-width: 100px;
}
@media (max-width: 480px) {
  .scanner-input-row button {
    width: 100%;
    flex: 1 1 100%;
  }
}
.scan-result {
  padding: 14px;
  border-radius: 8px;
  margin-top: 12px;
  font-weight: 700;
}
.scan-ok {
  background: rgba(34,197,94,0.2);
  color: #4ade80;
  border: 1px solid rgba(34,197,94,0.4);
}
.scan-warn {
  background: rgba(234,179,8,0.2);
  color: #facc15;
  border: 1px solid rgba(234,179,8,0.4);
}
.scan-err {
  background: rgba(239,68,68,0.2);
  color: #ff6b9d;
  border: 1px solid rgba(239,68,68,0.4);
}
.live-feed {
  max-height: 280px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  margin-top: 10px;
  background: rgba(0,0,0,0.3);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  backdrop-filter: blur(8px);
}
.live-feed div {
  padding: 10px 12px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  font-size: 13px;
  color: #cbd5e1;
}

/* Modals */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 200;
  backdrop-filter: blur(6px);
  padding: 16px;
}
.modal {
  width: min(560px, 100%);
  max-height: 90vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  background: rgba(13,6,31,0.96);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  color: #e2e8f0;
  padding: clamp(18px, 4vw, 26px);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 14px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 30px rgba(138,43,226,0.3);
}

.empty {
  text-align: center;
  padding: clamp(24px, 5vw, 45px);
  color: #94a3b8;
}
.star-rating-box {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.star {
  font-size: 30px;
  cursor: pointer;
  color: #94a3b8;
  transition: all 0.2s ease;
  touch-action: manipulation;
  user-select: none;
}
.star:hover {
  color: #d4a73d;
  transform: scale(1.15);
}
.star.on {
  color: #ffd700;
  text-shadow: 0 0 10px rgba(255,215,0,0.6);
}

#galaxy-bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  pointer-events: none;
  background: #05010e;
}
</style>
</head>
<body>
<canvas id="galaxy-bg"></canvas>
<div id="toast-banner"></div>
<nav>
  <div class="nav-brand">
    <div class="logo" onclick="closeMobileMenu();loadHome()">Event Portal</div>
  </div>
  <button class="nav-toggle" id="navToggle" onclick="toggleMobileMenu()" aria-label="Toggle navigation menu" aria-expanded="false">
    <span id="navToggleIcon">☰</span>
  </button>
  <div class="nav-links" id="nav"></div>
</nav>
<main class="container"><div id="app"></div></main>
<div id="modalRoot" class="modal-backdrop"></div>

<script>
const socket=io();
let token=localStorage.getItem("token"), user=JSON.parse(localStorage.getItem("user")||"null");
let pendingUserId=null, html5QrCode=null, scannerLocked=false, currentScannerEvent=null;

socket.on("connect",()=>{if(user)socket.emit("join_user_room",user.id)});
socket.on("realtime_notification",n=>{showToast("🔔 "+n.title+": "+n.message); nav()});
socket.on("broadcast_announcement",a=>showToast("📢 "+a.title+": "+a.message));
socket.on("seat_update",()=>{if(document.getElementById("events"))refreshSeatsQuietly()});
socket.on("checkin_broadcast",d=>{
 showToast("✅ "+d.userName+" checked in for "+d.eventTitle);
 const feed=document.getElementById("live-feed"); if(feed){const row=document.createElement("div");row.textContent=d.userName+" — "+d.eventTitle+" — "+new Date(d.attendedAt).toLocaleTimeString();feed.prepend(row)}
});

function showToast(msg){
  const t=document.getElementById("toast-banner");
  t.textContent=msg;
  t.style.display="block";
  clearTimeout(showToast.timer);
  showToast.timer=setTimeout(()=>t.style.display="none",4500);
}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function fmtDate(d){if(!d)return "-";const x=new Date(d+"T00:00:00");return isNaN(x)?d:x.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})}
function fmtTime(t){if(!t)return "-";const [h,m]=t.split(":");const d=new Date();d.setHours(+h,+m);return d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"})}

function toggleMobileMenu(){
  const nav=document.getElementById("nav");
  const toggle=document.getElementById("navToggle");
  const icon=document.getElementById("navToggleIcon");
  if(!nav) return;
  const isOpen=nav.classList.toggle("open");
  if(toggle) toggle.setAttribute("aria-expanded", isOpen);
  if(icon) icon.textContent=isOpen?"✕":"☰";
}

function closeMobileMenu(){
  const nav=document.getElementById("nav");
  const toggle=document.getElementById("navToggle");
  const icon=document.getElementById("navToggleIcon");
  if(nav && nav.classList.contains("open")){
    nav.classList.remove("open");
    if(toggle) toggle.setAttribute("aria-expanded","false");
    if(icon) icon.textContent="☰";
  }
}

document.addEventListener("click", e=>{
  const navBar=document.querySelector("nav");
  if(navBar && !navBar.contains(e.target)){
    closeMobileMenu();
  }
});

async function api(url,options={}){
 options.headers=options.headers||{}; if(!(options.body instanceof FormData))options.headers["Content-Type"]="application/json";
 if(token)options.headers.Authorization="Bearer "+token;
 const r=await fetch(url,options); let data=null; try{data=await r.json()}catch{}
 if(r.status===401&&token){logout(false);throw new Error(data?.error||"Session expired. Please login again.")}
 if(!r.ok)throw new Error(data?.error||"Request failed");
 return data;
}
function saveLogin(data){token=data.token;user=data.user;localStorage.setItem("token",token);localStorage.setItem("user",JSON.stringify(user));socket.emit("join_user_room",user.id)}
function logout(show=true){stopScanner();localStorage.removeItem("token");localStorage.removeItem("user");token=null;user=null;if(show)showToast("Logged out");load()}

async function nav(){
 const n=document.getElementById("nav");
 if(!user){
   n.innerHTML='<button onclick="closeMobileMenu();showLogin()">Login</button>';
   return;
 }
 let unread=0;try{const a=await api("/api/notifications");unread=a.filter(x=>!x.read).length}catch{}
 let b='<button onclick="closeMobileMenu();loadHome()">Events</button>';
 if(user.role==="student")b+='<button onclick="closeMobileMenu();myRegistrations()">My Registrations</button><button onclick="closeMobileMenu();showNotifications()">Notifications'+(unread?" ("+unread+")":"")+'</button>';
 else b+='<button onclick="closeMobileMenu();organizerDashboard()">Dashboard</button><button onclick="closeMobileMenu();showScanner()">Live Scanner</button><button onclick="closeMobileMenu();showNotifications()">Notifications'+(unread?" ("+unread+")":"")+'</button>';
 if(user.role==="admin")b+='<button onclick="closeMobileMenu();adminPanel()">Users</button>';
 b+='<button onclick="closeMobileMenu();profilePanel()">Profile</button>';
 b+='<div class="user-chip"><span>👤</span> '+esc(user.name)+'</div>';
 b+='<button class="btn-secondary" onclick="closeMobileMenu();logout()">Logout</button>';
 n.innerHTML=b;
}

function setApp(html){
  closeMobileMenu();
  stopScanner();
  document.getElementById("app").innerHTML=html;
  window.scrollTo({top:0,behavior:"smooth"});
}

 setApp(`<div class="card" style="max-width:520px;margin:auto"><h1 style="margin-top:0">Login</h1><p class="muted">Sign in to access your college event dashboard.</p><p id="loginError" class="error"></p><input id="email" type="email" placeholder="Email" autocomplete="email"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><div class="actions"><button onclick="login()">Login</button><button class="btn-secondary" onclick="showRegister()">Register</button></div><p class="small" style="margin-top:14px"><a href="#" onclick="showForgotPassword();return false;" style="color:#67e8f9">Forgot password?</a></p><hr style="border:0;border-top:1px solid rgba(255,255,255,0.1);margin:16px 0"><b>Demo accounts</b><p class="small" style="color:#94a3b8">Admin: admin@college.edu<br>Organizer: organizer@college.edu<br>Student: student1@college.edu<br>Password: password123</p></div>`);

async function loadHome(){
 stopScanner();await nav();
 let events=[];try{events=await api("/api/events")}catch(e){setApp(`<div class="card"><h2>Could not load events</h2><p class="error">${esc(e.message)}</p></div>`);return}
 setApp(`<section class="card hero"><h1>College Events</h1><p>Discover workshops, technical events, cultural programs and sports activities.</p><div class="grid"><input id="search" placeholder="🔎 Search title, venue or description" oninput="searchEvents()"><select id="categoryFilter" onchange="searchEvents()"><option value="">All Categories</option><option>Technical</option><option>Cultural</option><option>Sports</option><option>Workshop</option></select><select id="deptFilter" onchange="searchEvents()"><option value="">All Departments</option><option>Computer Science</option><option>Information Technology</option><option>Physical Education</option><option>All Departments</option></select></div></section><div class="events" id="events"></div>`);
 displayEvents(events)
}
let searchTimer;
async function searchEvents(){clearTimeout(searchTimer);searchTimer=setTimeout(async()=>{try{const q=encodeURIComponent(document.getElementById("search")?.value||"");const c=encodeURIComponent(document.getElementById("categoryFilter")?.value||"");const d=encodeURIComponent(document.getElementById("deptFilter")?.value||"");displayEvents(await api("/api/events?search="+q+"&category="+c+"&department="+d))}catch(e){showToast(e.message)}},200)}
async function refreshSeatsQuietly(){try{const events=await api("/api/events");events.forEach(e=>{const el=document.querySelector(`[data-seats="${e.id}"]`);if(el)el.textContent=e.seatsLeft+" / "+e.maxSeats})}catch{}}

function displayEvents(events){
 const box=document.getElementById("events");if(!box)return;
 if(!events.length){box.innerHTML='<div class="card empty">No events found. Try a different search or filter.</div>';return}
 box.innerHTML=events.map(e=>`<article class="event"><div><span class="badge">${esc(e.category)}</span><h2>${esc(e.title)}</h2><p style="color:#cbd5e1;line-height:1.4">${esc(e.description)}</p><p>📅 <b>${fmtDate(e.date)}</b> · ⏰ ${fmtTime(e.time)}</p><p>📍 ${esc(e.venue)}</p><p>🏫 ${esc(e.department||"All Departments")}</p><p>💺 Seats: <span data-seats="${e.id}">${e.seatsLeft} / ${e.maxSeats}</span></p><p>💳 <b>${e.fee>0?"₹"+e.fee:"Free"}</b></p>${e.avgRating?`<p>⭐ ${e.avgRating} (${e.reviewCount} reviews)</p>`:""}</div><div class="actions" style="margin-top:14px"><button onclick="eventDetails('${e.id}')">View Details</button>${e.seatsLeft<=0&&e.status!=="completed"?`<button onclick="joinWaitlist('${e.id}')">Join Waitlist</button>`:`<button onclick="registerEvent('${e.id}')" ${e.seatsLeft<=0||e.status==="completed"?"disabled":""}>${e.fee>0?"Pay & Register":"Register"}</button>`}<a class="btn btn-secondary" href="/api/events/${e.id}/export-ics">Calendar</a></div></article>`).join("")
}

async function eventDetails(id){
 try{
  const e=await api("/api/events/"+id);

 }catch(e){alert(e.message)}

async function registerEvent(id){
 if(!user){alert("Please login first");showLogin();return}
 if(user.role!=="student"){alert("Only student accounts can register for events.");return}
 try{
  const ev=await api("/api/events/"+id);
  if(ev.fee>0){await payAndRegister(ev);return}
  await api("/api/events/"+id+"/register",{method:"POST"});
  showToast("Registration successful!");myRegistrations()
 }catch(e){alert(e.message)}
}

async function payAndRegister(ev){
 try{
  const order=await api("/api/payments/create-order",{method:"POST",body:JSON.stringify({eventId:ev.id})});
  const rzp=new Razorpay({
   key:order.keyId,
   amount:order.amount,
   currency:order.currency,
   order_id:order.orderId,
   name:"College Event Portal",
   description:order.eventTitle,
   prefill:{name:user.name,email:user.email,contact:user.phone},
   theme:{color:"#7928ca"},
   handler:async function(response){
    try{
     await api("/api/payments/verify",{method:"POST",body:JSON.stringify({
      razorpay_order_id:response.razorpay_order_id,
      razorpay_payment_id:response.razorpay_payment_id,
      razorpay_signature:response.razorpay_signature
     })});
     showToast("Payment successful — registration confirmed!");
     myRegistrations();
    }catch(err){alert("Payment succeeded but confirmation failed: "+err.message)}
   },
   modal:{ondismiss:function(){showToast("Payment cancelled")}}
  });
  rzp.on("payment.failed",function(resp){alert("Payment failed: "+(resp.error?.description||"Please try again."))});
  rzp.open();
 }catch(e){alert(e.message)}
}
async function joinWaitlist(id){if(!user){alert("Please login first");showLogin();return}if(user.role!=="student"){alert("Only student accounts can join a waitlist.");return}try{const d=await api("/api/events/"+id+"/waitlist",{method:"POST"});showToast(d.message)}catch(e){alert(e.message)}}

async function myRegistrations(){
 if(!user){showLogin();return}await nav();
 try{
  const data=await api("/api/my-registrations");
  setApp(`<div class="card"><div class="header-actions"><h1>My Registrations</h1><button class="btn-secondary" onclick="loadHome()">Browse Events</button></div>${data.length?data.map(r=>`<div class="ticket-card"><h2>${esc(r.event?.title||r.eventTitle)}</h2><p>${r.event?fmtDate(r.event.date)+" · "+fmtTime(r.event.time)+" · "+esc(r.event.venue):""}</p><img class="qr" src="${r.qrCode}" alt="Ticket QR"><div class="checkin-code-box"><span class="small" style="color:#64748b">Check-in code (if QR scan fails):</span><br><b style="letter-spacing:2px;font-size:18px;color:#0f172a">${esc(r.checkinCode)}</b></div><p>Status: ${r.attended?'<span class="success">✓ Attendance verified</span>':'<b>Registered</b> — show this QR at the door'}</p>${r.event?.fee>0?`<p>💳 Paid: <b>₹${r.event.fee}</b></p>`:""}<div class="actions" style="margin-top:14px">${r.event?.fee>0?`<button class="btn-secondary" onclick="downloadReceipt('${r._id}')">Download Receipt</button>`:""}${r.attended?`<button onclick="downloadCert('${r._id}')">Download Certificate</button><button class="btn-secondary" onclick="reviewEvent('${r.eventId}')">Write Review</button>`:""}</div></div>`).join(""):'<div class="empty">You have no registrations yet.</div>'}</div>`)
 }catch(e){alert(e.message)}
}
async function downloadCert(id){try{const r=await fetch("/api/certificate/"+id,{headers:{Authorization:"Bearer "+token}});if(!r.ok){const x=await r.json();throw new Error(x.error)}const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="certificate.pdf";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){alert(e.message)}}
async function downloadReceipt(id){try{const r=await fetch("/api/payments/receipt/"+id,{headers:{Authorization:"Bearer "+token}});if(!r.ok){const x=await r.json();throw new Error(x.error)}const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="receipt.pdf";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){alert(e.message)}}

async function reviewEvent(eventId){
 const e=await api("/api/events/"+eventId);let rating=5;
 document.getElementById("modalRoot").style.display="flex";
 document.getElementById("modalRoot").innerHTML=`<div class="modal"><h2 style="margin-top:0">Review ${esc(e.title)}</h2><p style="margin-bottom:6px">Rating</p><div class="star-rating-box" id="stars">${[1,2,3,4,5].map(n=>`<span class="star ${n<=5?"on":""}" onclick="setRating(${n})">★</span>`).join("")}</div><textarea id="reviewComment" rows="4" placeholder="Share your experience..."></textarea><p id="reviewErr" class="error"></p><div class="actions"><button onclick="submitReview('${eventId}')">Submit Review</button><button class="btn-secondary" onclick="closeModal()">Cancel</button></div></div>`;
 window.setRating=n=>{rating=n;document.querySelectorAll("#stars .star").forEach((x,i)=>x.classList.toggle("on",i<n))};
 window.submitReview=async id=>{try{await api("/api/events/"+id+"/review",{method:"POST",body:JSON.stringify({rating,comment:document.getElementById("reviewComment").value})});closeModal();showToast("Review submitted");eventDetails(id)}catch(e){document.getElementById("reviewErr").textContent=e.message}}
}
function closeModal(){document.getElementById("modalRoot").style.display="none";document.getElementById("modalRoot").innerHTML=""}

async function organizerDashboard(){
 if(!user||!["admin","organizer"].includes(user.role)){showLogin();return}await nav();
 try{
  const events=await api("/api/events");const mine=user.role==="admin"?events:events.filter(e=>String(e.organizerId)===String(user.id)||e.organizerName===user.name);
  const total=mine.length,reg=mine.reduce((a,e)=>a+e.registered,0),seats=mine.reduce((a,e)=>a+e.maxSeats,0),avg=mine.filter(e=>e.avgRating).length?(mine.filter(e=>e.avgRating).reduce((a,e)=>a+Number(e.avgRating),0)/mine.filter(e=>e.avgRating).length).toFixed(1):"—";
  setApp(`<div class="card hero"><div class="header-actions"><div><h1>${user.role==="admin"?"Admin":"Organizer"} Dashboard</h1><p>Manage events, registrations and live attendance.</p></div><button onclick="showCreateEvent()">＋ Create Event</button></div><div class="grid"><div class="stat"><span>Events</span><strong>${total}</strong></div><div class="stat"><span>Registrations</span><strong>${reg}</strong></div><div class="stat"><span>Total Seats</span><strong>${seats}</strong></div><div class="stat"><span>Average Rating</span><strong>${avg}</strong></div></div></div><div class="events">${mine.length?mine.map(e=>eventManagerCard(e)).join(""):'<div class="card empty">No events created yet.</div>'}</div>`)
 }catch(e){setApp(`<div class="card"><p class="error">${esc(e.message)}</p></div>`)}
}
function eventManagerCard(e){
  return `<article class="event"><div><span class="badge">${esc(e.category)}</span><h2>${esc(e.title)}</h2><p>${fmtDate(e.date)} · ${fmtTime(e.time)} · ${esc(e.venue)}</p><p><b>${e.registered}</b> / ${e.maxSeats} registered · ${e.seatsLeft} seats left</p><p>Status: <b>${esc(e.status)}</b>${e.avgRating?` · ⭐ ${e.avgRating}`:""}</p></div><div class="actions" style="margin-top:14px"><button onclick="viewRegistrations('${e.id}')">Attendees</button><button onclick="editEvent('${e.id}')">Edit</button><button onclick="showScanner('${e.id}')">Scan</button><button class="btn-danger" onclick="deleteEvent('${e.id}')">Delete</button></div></article>`
}

function showCreateEvent(e=null){
 setApp(`<div class="card" style="max-width:680px;margin:auto"><h1 style="margin-top:0">${e?"Edit Event":"Create Event"}</h1><input id="etitle" placeholder="Event Title" value="${esc(e?.title||"")}"><textarea id="edesc" rows="3" placeholder="Description">${esc(e?.description||"")}</textarea><select id="ecat">${["Technical","Cultural","Sports","Workshop"].map(x=>`<option ${e?.category===x?"selected":""}>${x}</option>`).join("")}</select><input id="edate" type="date" value="${esc(e?.date||"")}"><input id="etime" type="time" value="${esc(e?.time||"")}"><input id="evenue" placeholder="Venue" value="${esc(e?.venue||"")}"><input id="edept" placeholder="Department" value="${esc(e?.department||"All Departments")}"><input id="eseats" type="number" min="1" value="${e?.maxSeats||50}"><input id="efee" type="number" min="0" step="0.01" placeholder="Registration fee in ₹ (0 = free)" value="${e?.fee||0}"><select id="estatus">${["upcoming","ongoing","completed","cancelled"].map(x=>`<option ${e?.status===x?"selected":""}>${x}</option>`).join("")}</select><p id="createError" class="error"></p><div class="actions"><button onclick="saveEvent(${e?`'${e.id}'`:"null"})">${e?"Save Changes":"Publish Event"}</button><button class="btn-secondary" onclick="organizerDashboard()">Cancel</button></div></div>`)
}
async function editEvent(id){try{showCreateEvent(await api("/api/events/"+id))}catch(e){alert(e.message)}}
async function saveEvent(id){
 const payload={title:document.getElementById("etitle").value.trim(),description:document.getElementById("edesc").value.trim(),category:document.getElementById("ecat").value,date:document.getElementById("edate").value,time:document.getElementById("etime").value,venue:document.getElementById("evenue").value.trim(),department:document.getElementById("edept").value.trim()||"All Departments",maxSeats:document.getElementById("eseats").value,fee:document.getElementById("efee").value,status:document.getElementById("estatus").value};
 try{await api(id?"/api/events/"+id:"/api/events",{method:id?"PUT":"POST",body:JSON.stringify(payload)});showToast(id?"Event updated":"Event published");organizerDashboard()}catch(e){document.getElementById("createError").textContent=e.message}}
async function deleteEvent(id){if(!confirm("Delete this event and notify all attendees?"))return;try{await api("/api/events/"+id,{method:"DELETE"});showToast("Event deleted");organizerDashboard()}catch(e){alert(e.message)}}

async function exportAttendeesCsv(id){try{const r=await fetch("/api/events/"+id+"/registrations/export",{headers:{Authorization:"Bearer "+token}});if(!r.ok){const x=await r.json();throw new Error(x.error)}const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="attendees.csv";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){alert(e.message)}}

async function showScanner(eventId=null){
 if(!user||!["admin","organizer"].includes(user.role)){alert("Organizer/Admin access required");return}await nav();currentScannerEvent=eventId;
 setApp(`<div class="card"><div class="header-actions"><button class="btn-secondary" onclick="organizerDashboard()">← Dashboard</button><h1>Live Ticket Scanner</h1></div><p style="color:#cbd5e1">Scan a student's QR ticket to verify attendance. If the camera isn't working, enter the 6-digit check-in code below.</p><div id="reader"></div><div class="scanner-input-row"><input id="manualQr" placeholder="6-digit check-in code or QR token"><button onclick="manualScan()">Verify</button></div><div id="scanStatus"></div><h3 style="margin-top:24px">Live check-in feed</h3><div class="live-feed" id="live-feed"></div></div>`);
 html5QrCode=new Html5Qrcode("reader");
 try{const cams=await Html5Qrcode.getCameras();if(!cams.length)throw new Error("No camera found");const cam=cams.find(c=>/back|rear|environment/i.test(c.label))||cams[cams.length-1];await html5QrCode.start(cam.id,{fps:10,qrbox:240},onScanSuccess,()=>{})}
 catch(err){document.getElementById("scanStatus").innerHTML=`<div class="scan-result scan-err">Camera unavailable: ${esc(err.message||err)}. Use the manual code field or allow camera access.</div>`}
}
async function manualScan(){const v=document.getElementById("manualQr").value.trim();if(!v)return;if(scannerLocked)return;scannerLocked=true;try{const body=/^\d{6}$/.test(v)?{checkinCode:v}:{qrPayload:v};const d=await api("/api/scan",{method:"POST",body:JSON.stringify(body)});const b=document.getElementById("scanStatus");b.innerHTML=`<div class="scan-result ${d.alreadyCheckedIn?"scan-warn":"scan-ok"}">${d.alreadyCheckedIn?"Already checked in":"✓ Attendance marked"}: ${esc(d.name)} — ${esc(d.eventTitle)}</div>`;document.getElementById("manualQr").value=""}catch(e){const b=document.getElementById("scanStatus");if(b)b.innerHTML=`<div class="scan-result scan-err">${esc(e.message)}</div>`}finally{setTimeout(()=>scannerLocked=false,1800)}}
async function onScanSuccess(decoded){
 if(scannerLocked)return;scannerLocked=true;
 try{const d=await api("/api/scan",{method:"POST",body:JSON.stringify({qrPayload:decoded})});const b=document.getElementById("scanStatus");b.innerHTML=`<div class="scan-result ${d.alreadyCheckedIn?"scan-warn":"scan-ok"}">${d.alreadyCheckedIn?"Already checked in":"✓ Attendance marked"}: ${esc(d.name)} — ${esc(d.eventTitle)}</div>`}
 catch(e){const b=document.getElementById("scanStatus");if(b)b.innerHTML=`<div class="scan-result scan-err">${esc(e.message)}</div>`}
 finally{setTimeout(()=>scannerLocked=false,1800)}
}
function stopScanner(){if(html5QrCode){html5QrCode.stop().then(()=>html5QrCode.clear()).catch(()=>{});html5QrCode=null}}

async function profilePanel(){
 await nav();
 try{
   const d=await api("/api/me");const u=d.user;
   setApp(`<div class="card" style="max-width:650px;margin:auto"><h1 style="margin-top:0">My Profile</h1><p class="muted">Account role: <b>${esc(u.role)}</b> · ${esc(u.email)}</p><input id="pname" value="${esc(u.name)}" placeholder="Name"><input id="pphone" value="${esc(u.phone)}" placeholder="Phone"><input id="pdept" value="${esc(u.department)}" placeholder="Department"><hr style="border:0;border-top:1px solid rgba(255,255,255,0.1);margin:20px 0"><h3>Change Password</h3><input id="pcurrent" type="password" placeholder="Current password"><input id="pnew" type="password" placeholder="New password (leave blank to keep current)"><p id="profileErr" class="error"></p><div class="actions"><button onclick="saveProfile()">Save Profile</button><button class="btn-secondary" onclick="loadHome()">Cancel</button></div></div>`)
 }catch(e){alert(e.message)}
}
async function saveProfile(){try{const d=await api("/api/me",{method:"PATCH",body:JSON.stringify({name:document.getElementById("pname").value,phone:document.getElementById("pphone").value,department:document.getElementById("pdept").value,currentPassword:document.getElementById("pcurrent").value,newPassword:document.getElementById("pnew").value})});saveLogin(d);showToast("Profile updated");profilePanel()}catch(e){document.getElementById("profileErr").textContent=e.message}}

async function adminPanel(){
 if(user?.role!=="admin"){alert("Admin access required");return}await nav();
 try{
   const [stats,users]=await Promise.all([api("/api/admin/stats"),api("/api/admin/users")]);
   setApp(`<div class="card hero"><h1>Admin Control Panel</h1><div class="grid"><div class="stat"><span>Total Users</span><strong>${stats.users}</strong></div><div class="stat"><span>Students</span><strong>${stats.students}</strong></div><div class="stat"><span>Organizers</span><strong>${stats.organizers}</strong></div><div class="stat"><span>Events</span><strong>${stats.events}</strong></div><div class="stat"><span>Registrations</span><strong>${stats.registrations}</strong></div><div class="stat"><span>Attendance</span><strong>${stats.attended}</strong></div></div></div><div class="card"><div class="header-actions"><h2>User Management</h2><button onclick="showAddUser()">＋ Add User</button></div><input id="userSearch" placeholder="Search users..." oninput="filterUsers()"><div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Department</th><th>Role</th><th>Actions</th></tr></thead><tbody id="usersBody">${userRows(users)}</tbody></table></div></div>`);
   window._users=users;
 }catch(e){alert(e.message)}
}
function userRows(users){if(!users.length)return'<tr><td colspan="5">No users found.</td></tr>';return users.map(u=>`<tr><td>${esc(u.name)}</td><td style="word-break:break-word">${esc(u.email)}</td><td>${esc(u.department)}</td><td><select onchange="changeRole('${u._id}',this.value)"><option ${u.role==="student"?"selected":""}>student</option><option ${u.role==="organizer"?"selected":""}>organizer</option><option ${u.role==="admin"?"selected":""}>admin</option></select></td><td><button class="btn-danger" onclick="removeUser('${u._id}')">Delete</button></td></tr>`).join("")}
function filterUsers(){const q=(document.getElementById("userSearch").value||"").toLowerCase();document.getElementById("usersBody").innerHTML=userRows((window._users||[]).filter(u=>(u.name+" "+u.email+" "+u.department+" "+u.role).toLowerCase().includes(q)))}
async function changeRole(id,newRole){try{await api("/api/admin/users/"+id+"/role",{method:"PATCH",body:JSON.stringify({role:newRole})});showToast("Role updated");adminPanel()}catch(e){alert(e.message)}}
async function removeUser(id){if(!confirm("Delete this user and their registrations?"))return;try{await api("/api/admin/users/"+id,{method:"DELETE"});showToast("User deleted");adminPanel()}catch(e){alert(e.message)}}
function showAddUser(){document.getElementById("modalRoot").style.display="flex";document.getElementById("modalRoot").innerHTML=`<div class="modal"><h2 style="margin-top:0">Add User</h2><input id="aname" placeholder="Full Name"><input id="aemail" type="email" placeholder="Email"><input id="aphone" placeholder="Phone e.g. +919876543210"><input id="apass" type="password" placeholder="Password"><input id="adept" placeholder="Department"><select id="arole"><option>student</option><option>organizer</option><option>admin</option></select><p id="addErr" class="error"></p><div class="actions"><button onclick="addUser()">Create</button><button class="btn-secondary" onclick="closeModal()">Cancel</button></div></div>`}
async function addUser(){try{await api("/api/admin/users",{method:"POST",body:JSON.stringify({name:document.getElementById("aname").value,email:document.getElementById("aemail").value,phone:document.getElementById("aphone").value,password:document.getElementById("apass").value,department:document.getElementById("adept").value,role:document.getElementById("arole").value})});closeModal();adminPanel();showToast("User created")}catch(e){document.getElementById("addErr").textContent=e.message}}

async function load(){await nav();if(user)loadHome();else showLogin()}
load();
</script>

<script>
(function(){
  var canvas=document.getElementById("galaxy-bg");
  if(!canvas) return;
  var ctx=canvas.getContext("2d");
  var stars=[], w, h, dpr=1;
  function resize(){
    dpr=Math.min(window.devicePixelRatio||1, 2);
    w=canvas.width=Math.floor(window.innerWidth*dpr);
    h=canvas.height=Math.floor(window.innerHeight*dpr);
    canvas.style.width=window.innerWidth+"px";
    canvas.style.height=window.innerHeight+"px";
  }
  function makeStars(n){
    stars=[];
    for(var i=0;i<n;i++){
      stars.push({
        x:Math.random()*w,
        y:Math.random()*h,
        r:(Math.random()*1.4+0.3)*dpr,
        speed:(Math.random()*0.15+0.02)*dpr,
        twinkle:Math.random()*Math.PI*2,
        hue:Math.random()<0.15?"#a78bfa":(Math.random()<0.3?"#67e8f9":"#e2e8f0")
      });
    }
  }
  function draw(){
    ctx.clearRect(0,0,w,h);
    var grad=ctx.createRadialGradient(w*0.2,h*0.15,0,w*0.2,h*0.15,Math.max(w,h)*0.7);
    grad.addColorStop(0,"rgba(90,40,150,0.18)");
    grad.addColorStop(0.5,"rgba(20,10,40,0.08)");
    grad.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=grad;
    ctx.fillRect(0,0,w,h);
    for(var i=0;i<stars.length;i++){
      var s=stars[i];
      s.twinkle+=0.02;
      var alpha=0.5+Math.sin(s.twinkle)*0.5;
      ctx.beginPath();
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=s.hue;
      ctx.globalAlpha=alpha;
      ctx.fill();
      s.y+=s.speed;
      if(s.y>h){s.y=0;s.x=Math.random()*w}
    }
    ctx.globalAlpha=1;
    requestAnimationFrame(draw);
  }
  var resizeTimer;
  window.addEventListener("resize",function(){
    clearTimeout(resizeTimer);
    resizeTimer=setTimeout(function(){
      resize();
      var count=Math.min(180, Math.max(30, Math.floor((window.innerWidth*window.innerHeight)/11000)));
      makeStars(count);
    }, 150);
  });
  resize();
  makeStars(Math.min(180, Math.max(30, Math.floor((window.innerWidth*window.innerHeight)/11000))));
  draw();
})();
</script>
