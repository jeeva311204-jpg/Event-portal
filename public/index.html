const socket = io();

socket.on("connect", () => {
    if (user) socket.emit("join_user_room", user.id);
});

socket.on("realtime_notification", (notif) => {
    showToast("New: " + notif.title + ": " + notif.message);
    nav();
});

socket.on("broadcast_announcement", (ann) => {
    showToast("Announcement: " + ann.title + ": " + ann.message);
});

socket.on("seat_update", () => {
    if (document.getElementById("events")) refreshSeatsQuietly();
});

socket.on("checkin_broadcast", (data) => {
    showToast("Live Check-In: " + data.userName + " checked in for " + data.eventTitle);
    const feed = document.getElementById("live-feed");
    if (feed) {
        const row = document.createElement("div");
        row.innerText = data.userName + " - " + data.eventTitle + " - " + new Date(data.attendedAt).toLocaleTimeString();
        feed.prepend(row);
    }
});

function showToast(msg) {
    const t = document.getElementById("toast-banner");
    t.innerText = msg;
    t.style.display = "block";
    setTimeout(() => { t.style.display = "none"; }, 4000);
}

let token = localStorage.getItem("token");
let user = JSON.parse(localStorage.getItem("user") || "null");

async function api(url, options = {}) {
    options.headers = options.headers || {};
    options.headers["Content-Type"] = "application/json";
    if (token) options.headers.Authorization = "Bearer " + token;

    const response = await fetch(url, options);
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Request failed");
    return data;
}

function saveLogin(data) {
    token = data.token;
    user = data.user;
    localStorage.setItem("token", token);
    localStorage.setItem("user", JSON.stringify(user));
    socket.emit("join_user_room", user.id);
}

function logout() {
    stopScanner();
    localStorage.clear();
    token = null;
    user = null;
    load();

async function refreshSeatsQuietly() {
    try {
        const events = await api("/api/events");
        events.forEach(e => {
            const el = document.querySelector("[data-seats=\"" + e.id + "\"]");
            if (el) el.innerText = e.seatsLeft + " / " + e.maxSeats;

function displayEvents(events) {
    const box = document.getElementById("events");
    if (!box) return;
    box.innerHTML = events.map(e => `
        <div class="event">
            <div>
                <span class="badge">${e.category}</span>
                <h2>${e.title}</h2>
                <p>${e.description}</p>
                <p><b>Date:</b> ${e.date} | <b>Time:</b> ${e.time}</p>
                <p><b>Venue:</b> ${e.venue}</p>
                <p><b>Seats Left:</b> <span data-seats="${e.id}">${e.seatsLeft} / ${e.maxSeats}</span></p>
            </div>
            <div style="margin-top:15px; display:flex; gap:8px; flex-wrap:wrap;">
                <button onclick="registerEvent('${e.id}')" ${e.seatsLeft <= 0 ? "disabled" : ""}>
                    ${e.seatsLeft <= 0 ? "Full" : "Register"}
                </button>
                <a class="btn btn-secondary" href="/api/events/${e.id}/export-ics">Calendar</a>
            </div>
        </div>
    `).join("");
}

async function registerEvent(id) {
    if (!user) { alert("Please login first"); showLogin(); return; }
    try {
        await api("/api/events/" + id + "/register", { method: "POST" });
        alert("Registered successfully! Check My Registrations for your QR ticket.");
        loadHome();
    } catch (e) {
        alert(e.message);
    }
}

async function myRegistrations() {
    stopScanner();
    await nav();
    const data = await api("/api/my-registrations");
    document.getElementById("app").innerHTML = `

                ${r.attended ? `<a class="btn" href="/api/certificate/${r._id || r.id}" onclick="downloadCert(event, '${r._id || r.id}')">Download Certificate</a>` : ""}
            </div>
        `).join("")}
    </div>
    `;
}

async function downloadCert(ev, regId) {
    ev.preventDefault();
    const res = await fetch("/api/certificate/" + regId, { headers: { Authorization: "Bearer " + token } });
    if (!res.ok) { alert((await res.json()).error); return; }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "certificate.pdf"; a.click();
}

let html5QrCode = null;
let scannerLocked = false;

async function showScanner() {
    await nav();
    document.getElementById("app").innerHTML = `
    <div class="card">
        <h1>Live Ticket Scanner</h1>
        <p>Point the camera at a student's QR ticket. Check-in happens instantly and is broadcast live to this screen and the student's phone.</p>
        <div id="reader"></div>
        <div id="scanStatus"></div>
        <h3>Live check-in feed</h3>
        <div class="live-feed" id="live-feed"></div>
    </div>
    `;

    html5QrCode = new Html5Qrcode("reader");
    try {
        const cameras = await Html5Qrcode.getCameras();
        const backCam = cameras.find(c => /back|rear|environment/i.test(c.label)) || cameras[cameras.length - 1];
        await html5QrCode.start(
            backCam ? backCam.id : { facingMode: "environment" },
            { fps: 10, qrbox: 250 },
            onScanSuccess,
            () => {}
        );
    } catch (err) {
        document.getElementById("scanStatus").innerHTML =
            "<div class=\"scan-result scan-err\">Camera access failed: " + (err.message || err) + ". Check browser camera permissions.</div>";
    }
}

async function onScanSuccess(decodedText) {
    if (scannerLocked) return;
    scannerLocked = true;

    try {
        const data = await api("/api/scan", { method: "POST", body: JSON.stringify({ qrPayload: decodedText }) });
        const box = document.getElementById("scanStatus");
        if (data.alreadyCheckedIn) {
            box.innerHTML = "<div class=\"scan-result scan-warn\">Already checked in: " + data.name + " - " + data.eventTitle + "</div>";
        } else {
            box.innerHTML = "<div class=\"scan-result scan-ok\">Checked in: " + data.name + " - " + data.eventTitle + "</div>";
        }
    } catch (e) {
        document.getElementById("scanStatus").innerHTML = "<div class=\"scan-result scan-err\">" + e.message + "</div>";
    }

    setTimeout(() => { scannerLocked = false; }, 2500);
}

function stopScanner() {
    if (html5QrCode) {
        html5QrCode.stop().then(() => html5QrCode.clear()).catch(() => {});
        html5QrCode = null;
    }
}

    await nav();
    loadHome();

let token=localStorage.getItem("token"), user=JSON.parse(localStorage.getItem("user")||"null");
let pendingUserId=null, html5QrCode=null, scannerLocked=false, currentScannerEvent=null;

socket.on("connect",()=>{if(user)socket.emit("join_user_room",user.id)});
socket.on("realtime_notification",n=>{showToast("🔔 "+n.title+": "+n.message); nav()});
socket.on("broadcast_announcement",a=>showToast("📢 "+a.title+": "+a.message));
socket.on("seat_update",()=>{if(document.getElementById("events"))refreshSeatsQuietly()});
socket.on("checkin_broadcast",d=>{
 showToast("✅ "+d.userName+" checked in for "+d.eventTitle);
 const feed=document.getElementById("live-feed"); if(feed){const row=document.createElement("div");row.textContent=d.userName+" — "+d.eventTitle+" — "+new Date(d.attendedAt).toLocaleTimeString();feed.prepend(row)}
});

function showToast(msg){const t=document.getElementById("toast-banner");t.textContent=msg;t.style.display="block";clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>t.style.display="none",4500)}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function fmtDate(d){if(!d)return "-";const x=new Date(d+"T00:00:00");return isNaN(x)?d:x.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})}
function fmtTime(t){if(!t)return "-";const [h,m]=t.split(":");const d=new Date();d.setHours(+h,+m);return d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"})}

async function api(url,options={}){
 options.headers=options.headers||{}; if(!(options.body instanceof FormData))options.headers["Content-Type"]="application/json";
 if(token)options.headers.Authorization="Bearer "+token;
 const r=await fetch(url,options); let data=null; try{data=await r.json()}catch{}
 if(r.status===401&&token){logout(false);throw new Error(data?.error||"Session expired. Please login again.")}
 if(!r.ok)throw new Error(data?.error||"Request failed");
 return data;
}
function saveLogin(data){token=data.token;user=data.user;localStorage.setItem("token",token);localStorage.setItem("user",JSON.stringify(user));socket.emit("join_user_room",user.id)}
function logout(show=true){stopScanner();localStorage.removeItem("token");localStorage.removeItem("user");token=null;user=null;if(show)showToast("Logged out");load()}
async function nav(){
 const n=document.getElementById("nav");
 if(!user){n.innerHTML='<button onclick="showLogin()">Login</button>';return}
 let unread=0;try{const a=await api("/api/notifications");unread=a.filter(x=>!x.read).length}catch{}
 let b='<button onclick="loadHome()">Events</button>';
 if(user.role==="student")b+='<button onclick="myRegistrations()">My Registrations</button><button onclick="showNotifications()">Notifications'+(unread?" ("+unread+")":"")+'</button>';
 else b+='<button onclick="organizerDashboard()">Dashboard</button><button onclick="showScanner()">Live Scanner</button><button onclick="showNotifications()">Notifications'+(unread?" ("+unread+")":"")+'</button>';
 if(user.role==="admin")b+='<button onclick="adminPanel()">Users</button>';
 b+='<button onclick="profilePanel()">Profile</button><span style="font-weight:700;margin-left:4px">'+esc(user.name)+'</span><button class="btn-secondary" onclick="logout()">Logout</button>';
 n.innerHTML=b;
}
function setApp(html){stopScanner();document.getElementById("app").innerHTML=html;window.scrollTo({top:0,behavior:"smooth"})}

function showLogin(){
 nav();setApp(`<div class="card" style="max-width:520px;margin:auto"><h1>Login</h1><p class="muted">Sign in to access your college event dashboard.</p><p id="loginError" class="error"></p><input id="email" type="email" placeholder="Email" autocomplete="email"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button onclick="login()">Login</button><button class="btn-secondary" onclick="showRegister()" style="margin-left:7px">Register</button><hr><b>Demo accounts</b><p class="small">Admin: admin@college.edu<br>Organizer: organizer@college.edu<br>Student: student1@college.edu<br>Password: password123</p></div>`)
}
async function login(){
 const err=document.getElementById("loginError");err.textContent="";
 try{const d=await api("/api/login",{method:"POST",body:JSON.stringify({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value})});if(d.twoFactorRequired){pendingUserId=d.userId;show2FA(d.message)}}catch(e){err.textContent=e.message}
}
function show2FA(msg){setApp(`<div class="card" style="max-width:520px;margin:auto"><h1>2-Step Verification</h1><p>${esc(msg)}</p><input id="otpCode" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit code"><p id="otpError" class="error"></p><button onclick="verifyOtp()">Verify & Login</button><button class="btn-secondary" onclick="resendOtp()">Resend</button><button class="btn-secondary" onclick="showLogin()">Cancel</button></div>`)}
async function verifyOtp(){try{const d=await api("/api/verify-otp",{method:"POST",body:JSON.stringify({userId:pendingUserId,otpCode:document.getElementById("otpCode").value.trim()})});saveLogin(d);load();}catch(e){document.getElementById("otpError").textContent=e.message;}}
async function resendOtp(){try{showToast((await api("/api/resend-otp",{method:"POST",body:JSON.stringify({userId:pendingUserId})})).message)}catch(e){alert(e.message)}}
function showRegister(){setApp(`<div class="card" style="max-width:560px;margin:auto"><h1>Create Student Account</h1><input id="rname" placeholder="Full Name"><input id="remail" type="email" placeholder="Email Address"><input id="rphone" placeholder="Phone, e.g. +919876543210"><input id="rpassword" type="password" placeholder="Password (min 6 characters)"><input id="rdept" placeholder="Department"><p id="regError" class="error"></p><button onclick="register()">Create Account</button><button class="btn-secondary" onclick="showLogin()">Back</button></div>`)}
async function register(){try{const d=await api("/api/register",{method:"POST",body:JSON.stringify({name:document.getElementById("rname").value.trim(),email:document.getElementById("remail").value.trim(),phone:document.getElementById("rphone").value.trim(),password:document.getElementById("rpassword").value,department:document.getElementById("rdept").value.trim()})});saveLogin(d);load()}catch(e){document.getElementById("regError").textContent=e.message}}

async function loadHome(){
 stopScanner();await nav();
 let events=[];try{events=await api("/api/events")}catch(e){setApp(`<div class="card"><h2>Could not load events</h2><p class="error">${esc(e.message)}</p></div>`);return}
 setApp(`<section class="card hero"><h1>College Events</h1><p>Discover workshops, technical events, cultural programs and sports activities.</p><div class="grid"><input id="search" placeholder="🔎 Search title, venue or description" oninput="searchEvents()"><select id="categoryFilter" onchange="searchEvents()"><option value="">All Categories</option><option>Technical</option><option>Cultural</option><option>Sports</option><option>Workshop</option></select><select id="deptFilter" onchange="searchEvents()"><option value="">All Departments</option><option>Computer Science</option><option>Information Technology</option><option>Physical Education</option><option>All Departments</option></select></div></section><div class="events" id="events"></div>`);
 displayEvents(events)
}
let searchTimer;
async function searchEvents(){clearTimeout(searchTimer);searchTimer=setTimeout(async()=>{try{const q=encodeURIComponent(document.getElementById("search")?.value||"");const c=encodeURIComponent(document.getElementById("categoryFilter")?.value||"");const d=encodeURIComponent(document.getElementById("deptFilter")?.value||"");displayEvents(await api("/api/events?search="+q+"&category="+c+"&department="+d))}catch(e){showToast(e.message)}},200)}
async function refreshSeatsQuietly(){try{const events=await api("/api/events");events.forEach(e=>{const el=document.querySelector(`[data-seats="${e.id}"]`);if(el)el.textContent=e.seatsLeft+" / "+e.maxSeats})}catch{}}
function displayEvents(events){
 const box=document.getElementById("events");if(!box)return;
 if(!events.length){box.innerHTML='<div class="card empty">No events found. Try a different search or filter.</div>';return}
 box.innerHTML=events.map(e=>`<article class="event"><div><span class="badge">${esc(e.category)}</span><h2>${esc(e.title)}</h2><p>${esc(e.description)}</p><p>📅 <b>${fmtDate(e.date)}</b> · ⏰ ${fmtTime(e.time)}</p><p>📍 ${esc(e.venue)}</p><p>🏫 ${esc(e.department||"All Departments")}</p><p>💺 Seats: <span data-seats="${e.id}">${e.seatsLeft} / ${e.maxSeats}</span></p>${e.avgRating?`<p>⭐ ${e.avgRating} (${e.reviewCount} reviews)</p>`:""}</div><div class="actions"><button onclick="eventDetails('${e.id}')">View Details</button><button onclick="registerEvent('${e.id}')" ${e.seatsLeft<=0||e.status==="completed"?"disabled":""}>${e.seatsLeft<=0?"Full":"Register"}</button><a class="btn btn-secondary" href="/api/events/${e.id}/export-ics">Calendar</a></div></article>`).join("")
}
async function eventDetails(id){
 try{const e=await api("/api/events/"+id);setApp(`<div class="card"><button class="btn-secondary" onclick="loadHome()">← Back</button><span class="badge" style="margin-left:8px">${esc(e.category)}</span><h1>${esc(e.title)}</h1><p>${esc(e.description)}</p><div class="grid"><div><b>📅 Date</b><p>${fmtDate(e.date)}</p></div><div><b>⏰ Time</b><p>${fmtTime(e.time)}</p></div><div><b>📍 Venue</b><p>${esc(e.venue)}</p></div><div><b>💺 Availability</b><p>${e.seatsLeft} / ${e.maxSeats}</p></div></div><div class="actions"><button onclick="registerEvent('${e.id}')" ${e.seatsLeft<=0?"disabled":""}>Register Now</button><a class="btn btn-secondary" href="/api/events/${e.id}/export-ics">Add to Calendar</a></div></div><div class="card"><h2>Reviews</h2>${e.reviews?.length?e.reviews.map(r=>`<div class="notif"><b>${esc(r.userName)}</b> · ${"⭐".repeat(Number(r.rating)||0)}<p>${esc(r.comment)}</p></div>`).join(""):'<p class="muted">No reviews yet.</p>'}</div>`)}catch(e){alert(e.message)}}
async function registerEvent(id){if(!user){alert("Please login first");showLogin();return}if(user.role!=="student"){alert("Only student accounts can register for events.");return}try{await api("/api/events/"+id+"/register",{method:"POST"});showToast("Registration successful!");myRegistrations()}catch(e){alert(e.message)}}

async function myRegistrations(){
 if(!user){showLogin();return}await nav();
 try{const data=await api("/api/my-registrations");setApp(`<div class="card"><div class="actions" style="justify-content:space-between"><h1>My Registrations</h1><button class="btn-secondary" onclick="loadHome()">Browse Events</button></div>${data.length?data.map(r=>`<div class="card" style="background:white;border:1px solid #ddd"><h2>${esc(r.event?.title||r.eventTitle)}</h2><p>${r.event?fmtDate(r.event.date)+" · "+fmtTime(r.event.time)+" · "+esc(r.event.venue):""}</p><img class="qr" src="${r.qrCode}" alt="Ticket QR"><p>Status: ${r.attended?'<span class="success">✓ Attendance verified</span>':'<b>Registered</b> — show this QR at the door'}</p><div class="actions">${r.attended?`<button onclick="downloadCert('${r._id}')">Download Certificate</button><button class="btn-secondary" onclick="reviewEvent('${r.eventId}')">Write Review</button>`:""}</div></div>`).join(""):'<div class="empty">You have no registrations yet.</div>'}</div>`)}catch(e){alert(e.message)}}
async function downloadCert(id){try{const r=await fetch("/api/certificate/"+id,{headers:{Authorization:"Bearer "+token}});if(!r.ok){const x=await r.json();throw new Error(x.error)}const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="certificate.pdf";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){alert(e.message)}}
async function reviewEvent(eventId){
 const e=await api("/api/events/"+eventId);let rating=5;
 document.getElementById("modalRoot").style.display="flex";document.getElementById("modalRoot").innerHTML=`<div class="modal"><h2>Review ${esc(e.title)}</h2><p>Rating</p><div id="stars">${[1,2,3,4,5].map(n=>`<span class="star ${n<=5?"on":""}" onclick="setRating(${n})">★</span>`).join("")}</div><textarea id="reviewComment" rows="4" placeholder="Share your experience..."></textarea><p id="reviewErr" class="error"></p><div class="actions"><button onclick="submitReview('${eventId}')">Submit Review</button><button class="btn-secondary" onclick="closeModal()">Cancel</button></div></div>`;
 window.setRating=n=>{rating=n;document.querySelectorAll("#stars .star").forEach((x,i)=>x.classList.toggle("on",i<n))};window.submitReview=async id=>{try{await api("/api/events/"+id+"/review",{method:"POST",body:JSON.stringify({rating,comment:document.getElementById("reviewComment").value})});closeModal();showToast("Review submitted");eventDetails(id)}catch(e){document.getElementById("reviewErr").textContent=e.message}}
}
function closeModal(){document.getElementById("modalRoot").style.display="none";document.getElementById("modalRoot").innerHTML=""}

async function organizerDashboard(){
 if(!user||!["admin","organizer"].includes(user.role)){showLogin();return}await nav();
 try{
  const events=await api("/api/events");const mine=user.role==="admin"?events:events.filter(e=>String(e.organizerId)===String(user.id)||e.organizerName===user.name);
  const total=mine.length,reg=mine.reduce((a,e)=>a+e.registered,0),seats=mine.reduce((a,e)=>a+e.maxSeats,0),avg=mine.filter(e=>e.avgRating).length?(mine.filter(e=>e.avgRating).reduce((a,e)=>a+Number(e.avgRating),0)/mine.filter(e=>e.avgRating).length).toFixed(1):"—";
  setApp(`<div class="card hero"><div class="actions" style="justify-content:space-between"><div><h1>${user.role==="admin"?"Admin":"Organizer"} Dashboard</h1><p>Manage events, registrations and live attendance.</p></div><button onclick="showCreateEvent()">＋ Create Event</button></div><div class="grid"><div class="stat"><span>Events</span><strong>${total}</strong></div><div class="stat"><span>Registrations</span><strong>${reg}</strong></div><div class="stat"><span>Total Seats</span><strong>${seats}</strong></div><div class="stat"><span>Average Rating</span><strong>${avg}</strong></div></div></div><div class="events">${mine.length?mine.map(e=>eventManagerCard(e)).join(""):'<div class="card empty">No events created yet.</div>'}</div>`)
 }catch(e){setApp(`<div class="card"><p class="error">${esc(e.message)}</p></div>`)}
}
function eventManagerCard(e){return `<article class="event"><div><span class="badge">${esc(e.category)}</span><h2>${esc(e.title)}</h2><p>${fmtDate(e.date)} · ${fmtTime(e.time)} · ${esc(e.venue)}</p><p><b>${e.registered}</b> / ${e.maxSeats} registered · ${e.seatsLeft} seats left</p><p>Status: <b>${esc(e.status)}</b>${e.avgRating?` · ⭐ ${e.avgRating}`:""}</p></div><div class="actions"><button onclick="viewRegistrations('${e.id}')">Attendees</button><button onclick="editEvent('${e.id}')">Edit</button><button onclick="showScanner('${e.id}')">Scan</button><button class="btn-danger" onclick="deleteEvent('${e.id}')">Delete</button></div></article>`}
function showCreateEvent(e=null){
 setApp(`<div class="card"><h1>${e?"Edit Event":"Create Event"}</h1><input id="etitle" placeholder="Event Title" value="${esc(e?.title||"")}"><textarea id="edesc" rows="3" placeholder="Description">${esc(e?.description||"")}</textarea><select id="ecat">${["Technical","Cultural","Sports","Workshop"].map(x=>`<option ${e?.category===x?"selected":""}>${x}</option>`).join("")}</select><input id="edate" type="date" value="${esc(e?.date||"")}"><input id="etime" type="time" value="${esc(e?.time||"")}"><input id="evenue" placeholder="Venue" value="${esc(e?.venue||"")}"><input id="edept" placeholder="Department" value="${esc(e?.department||"All Departments")}"><input id="eseats" type="number" min="1" value="${e?.maxSeats||50}"><select id="estatus">${["upcoming","ongoing","completed","cancelled"].map(x=>`<option ${e?.status===x?"selected":""}>${x}</option>`).join("")}</select><p id="createError" class="error"></p><div class="actions"><button onclick="saveEvent(${e?`'${e.id}'`:"null"})">${e?"Save Changes":"Publish Event"}</button><button class="btn-secondary" onclick="organizerDashboard()">Cancel</button></div></div>`)
}
async function editEvent(id){try{showCreateEvent(await api("/api/events/"+id))}catch(e){alert(e.message)}}
async function saveEvent(id){
 const payload={title:document.getElementById("etitle").value.trim(),description:document.getElementById("edesc").value.trim(),category:document.getElementById("ecat").value,date:document.getElementById("edate").value,time:document.getElementById("etime").value,venue:document.getElementById("evenue").value.trim(),department:document.getElementById("edept").value.trim()||"All Departments",maxSeats:document.getElementById("eseats").value,status:document.getElementById("estatus").value};
 try{await api(id?"/api/events/"+id:"/api/events",{method:id?"PUT":"POST",body:JSON.stringify(payload)});showToast(id?"Event updated":"Event published");organizerDashboard()}catch(e){document.getElementById("createError").textContent=e.message}}
async function deleteEvent(id){if(!confirm("Delete this event and notify all attendees?"))return;try{await api("/api/events/"+id,{method:"DELETE"});showToast("Event deleted");organizerDashboard()}catch(e){alert(e.message)}}
async function viewRegistrations(id){
 try{const e=await api("/api/events/"+id),regs=await api("/api/events/"+id+"/registrations");setApp(`<div class="card"><div class="actions"><button class="btn-secondary" onclick="organizerDashboard()">← Dashboard</button><h1>${esc(e.title)} — Attendees</h1></div><p>${regs.length} registrations · ${regs.filter(r=>r.attended).length} checked in</p><div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Status</th><th>Registered</th></tr></thead><tbody>${regs.length?regs.map(r=>`<tr><td>${esc(r.userName)}</td><td>${esc(r.userEmail)}</td><td>${esc(r.userPhone)}</td><td>${r.attended?'<span class="success">Checked in</span>':'Registered'}</td><td>${new Date(r.createdAt).toLocaleString("en-IN")}</td></tr>`).join(""):'<tr><td colspan="5">No registrations.</td></tr>'}</tbody></table></div></div>`)}catch(e){alert(e.message)}}

async function showNotifications(){
 if(!user){showLogin();return}await nav();try{const a=await api("/api/notifications");await api("/api/notifications/mark-read",{method:"POST"});setApp(`<div class="card"><div class="actions" style="justify-content:space-between"><h1>Notifications</h1><button class="btn-secondary" onclick="loadHome()">Back</button></div>${a.length?a.map(n=>`<div class="notif ${n.read?"":"unread"}"><h3>${esc(n.title)}</h3><p>${esc(n.message)}</p><small>${new Date(n.createdAt).toLocaleString("en-IN")}</small></div>`).join(""):'<div class="empty">No notifications.</div>'}</div>`)}catch(e){alert(e.message)}}

async function showScanner(eventId=null){
 if(!user||!["admin","organizer"].includes(user.role)){alert("Organizer/Admin access required");return}await nav();currentScannerEvent=eventId;
 setApp(`<div class="card"><div class="actions"><button class="btn-secondary" onclick="organizerDashboard()">← Dashboard</button><h1>Live Ticket Scanner</h1></div><p>Scan a student's QR ticket to verify attendance. You can also paste a QR payload for testing.</p><div id="reader"></div><div class="actions" style="max-width:650px;margin:auto"><input id="manualQr" placeholder="Paste QR token here" style="margin:0"><button onclick="manualScan()">Verify Token</button></div><div id="scanStatus"></div><h3>Live check-in feed</h3><div class="live-feed" id="live-feed"></div></div>`);
 html5QrCode=new Html5Qrcode("reader");
 try{const cams=await Html5Qrcode.getCameras();if(!cams.length)throw new Error("No camera found");const cam=cams.find(c=>/back|rear|environment/i.test(c.label))||cams[cams.length-1];await html5QrCode.start(cam.id,{fps:10,qrbox:250},onScanSuccess,()=>{})}
 catch(err){document.getElementById("scanStatus").innerHTML=`<div class="scan-result scan-err">Camera unavailable: ${esc(err.message||err)}. Use the manual token field or allow camera access.</div>`}
}
async function manualScan(){const v=document.getElementById("manualQr").value.trim();if(v)await onScanSuccess(v)}
async function onScanSuccess(decoded){
 if(scannerLocked)return;scannerLocked=true;
 try{const d=await api("/api/scan",{method:"POST",body:JSON.stringify({qrPayload:decoded})});const b=document.getElementById("scanStatus");b.innerHTML=`<div class="scan-result ${d.alreadyCheckedIn?"scan-warn":"scan-ok"}">${d.alreadyCheckedIn?"Already checked in":"✓ Attendance marked"}: ${esc(d.name)} — ${esc(d.eventTitle)}</div>`}
 catch(e){const b=document.getElementById("scanStatus");if(b)b.innerHTML=`<div class="scan-result scan-err">${esc(e.message)}</div>`}
 finally{setTimeout(()=>scannerLocked=false,1800)}
}
function stopScanner(){if(html5QrCode){html5QrCode.stop().then(()=>html5QrCode.clear()).catch(()=>{});html5QrCode=null}}

async function profilePanel(){
 await nav();try{const d=await api("/api/me");const u=d.user;setApp(`<div class="card" style="max-width:650px;margin:auto"><h1>My Profile</h1><p class="muted">Account role: <b>${esc(u.role)}</b> · ${esc(u.email)}</p><input id="pname" value="${esc(u.name)}" placeholder="Name"><input id="pphone" value="${esc(u.phone)}" placeholder="Phone"><input id="pdept" value="${esc(u.department)}" placeholder="Department"><hr><h3>Change Password</h3><input id="pcurrent" type="password" placeholder="Current password"><input id="pnew" type="password" placeholder="New password (leave blank to keep current)"><p id="profileErr" class="error"></p><div class="actions"><button onclick="saveProfile()">Save Profile</button><button class="btn-secondary" onclick="loadHome()">Cancel</button></div></div>`)}catch(e){alert(e.message)}}
async function saveProfile(){try{const d=await api("/api/me",{method:"PATCH",body:JSON.stringify({name:document.getElementById("pname").value,phone:document.getElementById("pphone").value,department:document.getElementById("pdept").value,currentPassword:document.getElementById("pcurrent").value,newPassword:document.getElementById("pnew").value})});saveLogin(d);showToast("Profile updated");profilePanel()}catch(e){document.getElementById("profileErr").textContent=e.message}}

async function adminPanel(){
 if(user?.role!=="admin"){alert("Admin access required");return}await nav();
 try{const [stats,users]=await Promise.all([api("/api/admin/stats"),api("/api/admin/users")]);setApp(`<div class="card hero"><h1>Admin Control Panel</h1><div class="grid"><div class="stat"><span>Total Users</span><strong>${stats.users}</strong></div><div class="stat"><span>Students</span><strong>${stats.students}</strong></div><div class="stat"><span>Organizers</span><strong>${stats.organizers}</strong></div><div class="stat"><span>Events</span><strong>${stats.events}</strong></div><div class="stat"><span>Registrations</span><strong>${stats.registrations}</strong></div><div class="stat"><span>Attendance</span><strong>${stats.attended}</strong></div></div></div><div class="card"><div class="actions" style="justify-content:space-between"><h2>User Management</h2><button onclick="showAddUser()">＋ Add User</button></div><input id="userSearch" placeholder="Search users..." oninput="filterUsers()"><div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Department</th><th>Role</th><th>Actions</th></tr></thead><tbody id="usersBody">${userRows(users)}</tbody></table></div></div>`);window._users=users}catch(e){alert(e.message)}}
function userRows(users){if(!users.length)return'<tr><td colspan="5">No users found.</td></tr>';return users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.department)}</td><td><select onchange="changeRole('${u._id}',this.value)"><option ${u.role==="student"?"selected":""}>student</option><option ${u.role==="organizer"?"selected":""}>organizer</option><option ${u.role==="admin"?"selected":""}>admin</option></select></td><td><button class="btn-danger" onclick="removeUser('${u._id}')">Delete</button></td></tr>`).join("")}
function filterUsers(){const q=(document.getElementById("userSearch").value||"").toLowerCase();document.getElementById("usersBody").innerHTML=userRows((window._users||[]).filter(u=>(u.name+" "+u.email+" "+u.department+" "+u.role).toLowerCase().includes(q)))}
